# Configurazione logrotate per i log di BTP_Monitor.
# Mantiene 30 giorni di log, con un archivio compresso al giorno.
# "copytruncate" è essenziale: i nostri script tengono il file aperto in append,
# quindi logrotate copia+tronca invece di rinominare (nessun riavvio necessario).
# Allineato all'approccio usato per il progetto Euribor.
#
# NOTA: btp_log.txt è volutamente ESCLUSO da questa rotazione. È lo storico
# permanente dei prezzi dei BTP (dati finanziari da conservare per analisi e
# confronti nel tempo): non va mai troncato né cancellato automaticamente.

/home/radam/Documenti/CLINE/BTP_Monitor/log/grafico_run.log
/home/radam/Documenti/CLINE/BTP_Monitor/log/monitor_run.log
{
    daily
    rotate 30
    maxage 30
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y-%m-%d
}
